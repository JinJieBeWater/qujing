name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/cli/native/transport/go.mod

      - run: bun install --frozen-lockfile
      - name: Verify tag version
        run: |
          version=$(bun -e 'import packageJson from "./apps/cli/package.json"; process.stdout.write(packageJson.version)')
          test "$GITHUB_REF_NAME" = "v$version"
      - run: bun run verify
      - run: bun run build:release all

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.tar.gz dist/*.zip dist/SHA256SUMS
          --verify-tag
          --generate-notes
          --title "Colleague Line $GITHUB_REF_NAME"
